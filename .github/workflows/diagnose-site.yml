name: Site diagnostic

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify demo task
        run: |
          set +e
          BASE="https://masteragent-nine.vercel.app"
          S="$GITHUB_STEP_SUMMARY"
          curl -sS -m 45 -c /tmp/ck.txt -X POST "$BASE/api/auth/login" \
            -H "Content-Type: application/json" \
            -d '{"email":"wakeelypro@gmail.com","password":"W8SDfQoseXRWKSJXVW"}' > /dev/null

          echo "### TASK 92" >> "$S"
          curl -sS -m 45 -b /tmp/ck.txt "$BASE/api/admin/tasks/92" -w '\nHTTP_CODE=%{http_code}\n' >> "$S"
          echo >> "$S"

          echo "### RECENT CONTENT ITEMS" >> "$S"
          curl -sS -m 45 -b /tmp/ck.txt "$BASE/api/admin/content" -o /tmp/c.json
          jq '[.data.items[] | {id, title, lifecycle, unprocessedReason, createdAt}] | sort_by(.id) | .[-3:]' /tmp/c.json >> "$S"
