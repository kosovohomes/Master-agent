name: Site diagnostic

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Probe admin surfaces
        run: |
          set +e
          TOKENS=("cc3d1de208cdf1cdbf322503441216911d5c526b5b8e882edf83d2d2a302b822" "2b83135d846d421b17d8c590d3550beb437aeab15dd50e9bcaf9394f29e00862")
          for TOK in "${TOKENS[@]}"; do
            echo "#### TOKEN ${TOK:0:6}" >> "$GITHUB_STEP_SUMMARY"
            for path in env-check settings agents business-units tasks; do
              echo "=== $path ===" >> "$GITHUB_STEP_SUMMARY"
              curl -sS -m 45 -w '\nHTTP_CODE=%{http_code}\n' "https://masteragent-nine.vercel.app/api/admin/$path" -H "Authorization: Bearer $TOK" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
            done
          done
